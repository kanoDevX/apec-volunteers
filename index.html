<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEC Volunteers — Student volunteer community at APEC Petrotechnic Higher College</title>
  <meta name="description" content="APEC Volunteers is the student-run volunteer community at APEC Petrotechnic Higher College, Atyrau. Apply in one short form." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <script type="module" src="/src/main.js"></script>
</head>
<body class="bg-paper text-ink antialiased">

  <header id="site-header" class="fixed top-0 inset-x-0 z-50 transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-5 sm:px-8 flex items-center justify-between h-16">
      <a href="#top" class="flex items-center gap-2.5 shrink-0">
        <img src="/logo-icon.png" alt="" aria-hidden="true" class="h-8 w-auto" />
        <span class="font-display font-bold text-lg tracking-tight">APEC <span class="text-olive-600">Volunteers</span></span>
      </a>

      <nav class="hidden md:flex items-center gap-8 font-medium text-sm">
        <a href="#about" data-i18n="nav.about" class="hover:text-olive-600 transition-colors"></a>
        <a href="#how-it-works" data-i18n="nav.how" class="hover:text-olive-600 transition-colors"></a>
        <a href="#faq" data-i18n="nav.faq" class="hover:text-olive-600 transition-colors"></a>
      </nav>

      <div class="flex items-center gap-4">
        <div class="hidden sm:flex items-center gap-2 text-sm" role="group" aria-label="Language">
          <button type="button" class="lang-btn text-ink/50 px-1" data-lang="ru">RU</button>
          <span class="text-ink/20">/</span>
          <button type="button" class="lang-btn text-ink/50 px-1" data-lang="kk">KZ</button>
          <span class="text-ink/20">/</span>
          <button type="button" class="lang-btn text-ink/50 px-1" data-lang="en">EN</button>
        </div>
        <a href="#apply" data-i18n="nav.apply" class="hidden sm:inline-flex items-center rounded-lg bg-amber-500 px-5 py-2.5 font-display font-semibold text-sm text-ink hover:bg-amber-600 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-300"></a>
        <button id="nav-toggle" class="md:hidden p-2 -mr-2" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-nav">
          <svg id="nav-icon-open" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <svg id="nav-icon-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hidden"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div id="mobile-nav" class="md:hidden hidden bg-paper border-t border-ink/10 px-5 py-4">
      <div class="flex items-center gap-2 text-sm mb-4" role="group" aria-label="Language">
        <button type="button" class="lang-btn text-ink/50 px-1" data-lang="ru">RU</button>
        <span class="text-ink/20">/</span>
        <button type="button" class="lang-btn text-ink/50 px-1" data-lang="kk">KZ</button>
        <span class="text-ink/20">/</span>
        <button type="button" class="lang-btn text-ink/50 px-1" data-lang="en">EN</button>
      </div>
      <nav class="flex flex-col gap-4 font-medium">
        <a href="#about" data-i18n="nav.about" class="py-1"></a>
        <a href="#how-it-works" data-i18n="nav.how" class="py-1"></a>
        <a href="#faq" data-i18n="nav.faq" class="py-1"></a>
        <a href="#apply" data-i18n="nav.apply" class="mt-2 inline-flex justify-center items-center rounded-lg bg-amber-500 px-5 py-3 font-display font-semibold text-ink"></a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="relative pt-32 pb-20 sm:pt-40 sm:pb-28 px-5 sm:px-8 overflow-hidden">
      <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12 items-center">
        <div class="hero-copy order-2 md:order-1">
          <h1 data-i18n="hero.title" class="font-display font-extrabold text-4xl sm:text-5xl leading-tight tracking-tight text-ink"></h1>
          <p data-i18n="hero.subtitle" class="mt-5 text-lg text-ink/70 max-w-md leading-relaxed"></p>
          <div class="mt-8 flex flex-wrap gap-4">
            <a href="#apply" data-i18n="hero.cta_apply" class="inline-flex items-center rounded-lg bg-amber-500 px-6 py-3 font-display font-semibold text-ink hover:bg-amber-600 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-300"></a>
            <a href="#how-it-works" data-i18n="hero.cta_how" class="inline-flex items-center rounded-lg border border-olive-600 px-6 py-3 font-display font-semibold text-olive-700 hover:bg-olive-50 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-olive-300"></a>
          </div>
        </div>

        <div class="order-1 md:order-2 flex justify-center" aria-hidden="true">
          <img src="/logo-icon.png" alt="" class="hero-mark w-56 h-56 sm:w-72 sm:h-72 object-contain" />
        </div>
      </div>
    </section>

    <section id="about" class="px-5 sm:px-8 py-16 sm:py-20">
      <div class="max-w-2xl mx-auto text-center">
        <p data-i18n="mission.p1" class="text-xl sm:text-2xl font-display font-medium leading-relaxed text-ink"></p>
        <p data-i18n="mission.p2" class="mt-4 text-olive-700 font-medium"></p>
      </div>
    </section>

    <section class="px-5 sm:px-8 py-16 sm:py-20 bg-olive-50">
      <div class="max-w-5xl mx-auto grid sm:grid-cols-3 gap-10">
        <div>
          <div class="w-10 h-10 rounded-full bg-amber-500/15 flex items-center justify-center mb-4">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A26710" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <h3 data-i18n="pillars.community.title" class="font-display font-bold text-lg"></h3>
          <p data-i18n="pillars.community.desc" class="mt-2 text-ink/70 leading-relaxed"></p>
        </div>
        <div>
          <div class="w-10 h-10 rounded-full bg-amber-500/15 flex items-center justify-center mb-4">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A26710" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <h3 data-i18n="pillars.action.title" class="font-display font-bold text-lg"></h3>
          <p data-i18n="pillars.action.desc" class="mt-2 text-ink/70 leading-relaxed"></p>
        </div>
        <div>
          <div class="w-10 h-10 rounded-full bg-amber-500/15 flex items-center justify-center mb-4">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A26710" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>
          </div>
          <h3 data-i18n="pillars.growth.title" class="font-display font-bold text-lg"></h3>
          <p data-i18n="pillars.growth.desc" class="mt-2 text-ink/70 leading-relaxed"></p>
        </div>
      </div>
    </section>

    <section id="how-it-works" class="px-5 sm:px-8 py-16 sm:py-24">
      <div class="max-w-5xl mx-auto">
        <h2 data-i18n="how.title" class="font-display font-bold text-3xl text-center mb-14"></h2>
        <div class="grid sm:grid-cols-3 gap-10">
          <div class="text-center sm:text-left">
            <div class="w-11 h-11 rounded-full bg-olive-600 text-paper font-display font-bold flex items-center justify-center mx-auto sm:mx-0 mb-4">1</div>
            <h3 data-i18n="how.step1.title" class="font-display font-semibold text-lg"></h3>
            <p data-i18n="how.step1.desc" class="mt-2 text-ink/70 leading-relaxed"></p>
          </div>
          <div class="text-center sm:text-left">
            <div class="w-11 h-11 rounded-full bg-olive-600 text-paper font-display font-bold flex items-center justify-center mx-auto sm:mx-0 mb-4">2</div>
            <h3 data-i18n="how.step2.title" class="font-display font-semibold text-lg"></h3>
            <p data-i18n="how.step2.desc" class="mt-2 text-ink/70 leading-relaxed"></p>
          </div>
          <div class="text-center sm:text-left">
            <div class="w-11 h-11 rounded-full bg-olive-600 text-paper font-display font-bold flex items-center justify-center mx-auto sm:mx-0 mb-4">3</div>
            <h3 data-i18n="how.step3.title" class="font-display font-semibold text-lg"></h3>
            <p data-i18n="how.step3.desc" class="mt-2 text-ink/70 leading-relaxed"></p>
          </div>
        </div>
      </div>
    </section>

    <section id="apply" class="px-5 sm:px-8 py-16 sm:py-24 bg-olive-50">
      <div class="max-w-xl mx-auto">
        <div id="form-wrap">
          <h2 data-i18n="form.title" class="font-display font-bold text-3xl text-center"></h2>
          <p data-i18n="form.subtitle" class="mt-3 text-center text-ink/70"></p>

          <form id="apply-form" class="mt-10 space-y-6" novalidate>
            <div class="hp-field" aria-hidden="true">
              <label for="company">Company</label>
              <input type="text" id="company" name="company" tabindex="-1" autocomplete="off" />
            </div>

            <div>
              <label for="full-name" data-i18n="form.label.fullName" class="block font-medium mb-1.5"></label>
              <input type="text" id="full-name" name="fullName" required
                class="w-full rounded-lg border border-ink/15 px-4 py-3 bg-paper focus:outline-none focus:ring-2 focus:ring-amber-300 focus:border-amber-400 transition"
                aria-describedby="full-name-error" />
              <p id="full-name-error" class="hidden mt-1.5 text-sm text-red-600" aria-live="polite"></p>
            </div>

            <div>
              <label for="institution" data-i18n="form.label.institution" class="block font-medium mb-1.5"></label>
              <input type="text" id="institution" name="institution" value="APEC Petrotechnic Higher College" required
                class="w-full rounded-lg border border-ink/15 px-4 py-3 bg-paper focus:outline-none focus:ring-2 focus:ring-amber-300 focus:border-amber-400 transition"
                aria-describedby="institution-error" />
              <p id="institution-error" class="hidden mt-1.5 text-sm text-red-600" aria-live="polite"></p>
            </div>

            <div>
              <label for="group" data-i18n="form.label.group" class="block font-medium mb-1.5"></label>
              <input type="text" id="group" name="group" data-i18n-placeholder="form.placeholder.group" required
                class="w-full rounded-lg border border-ink/15 px-4 py-3 bg-paper focus:outline-none focus:ring-2 focus:ring-amber-300 focus:border-amber-400 transition"
                aria-describedby="group-help group-error" />
              <p id="group-help" data-i18n="form.help.group" class="mt-1.5 text-sm text-ink/50"></p>
              <p id="group-error" class="hidden mt-1.5 text-sm text-red-600" aria-live="polite"></p>
            </div>

            <div>
              <label for="email" class="block font-medium mb-1.5"><span data-i18n="form.label.email"></span> <span class="text-ink/40 font-normal" data-i18n="form.optional"></span></label>
              <input type="email" id="email" name="email"
                class="w-full rounded-lg border border-ink/15 px-4 py-3 bg-paper focus:outline-none focus:ring-2 focus:ring-amber-300 focus:border-amber-400 transition"
                aria-describedby="email-error" />
              <p id="email-error" class="hidden mt-1.5 text-sm text-red-600" aria-live="polite"></p>
            </div>

            <div>
              <label for="phone" data-i18n="form.label.phone" class="block font-medium mb-1.5"></label>
              <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" required
                class="w-full rounded-lg border border-ink/15 px-4 py-3 bg-paper focus:outline-none focus:ring-2 focus:ring-amber-300 focus:border-amber-400 transition"
                aria-describedby="phone-error" />
              <p id="phone-error" class="hidden mt-1.5 text-sm text-red-600" aria-live="polite"></p>
            </div>

            <fieldset>
              <legend class="block font-medium mb-2.5"><span data-i18n="form.label.interests"></span> <span class="text-ink/40 font-normal" data-i18n="form.optional"></span></legend>
              <div class="flex flex-wrap gap-2">
                <label class="chip cursor-pointer">
                  <input type="checkbox" name="interests" value="Event organizing" class="sr-only peer" />
                  <span data-i18n="form.chip.events" class="inline-block rounded-full border border-ink/20 px-4 py-2 text-sm transition-colors"></span>
                </label>
                <label class="chip cursor-pointer">
                  <input type="checkbox" name="interests" value="Environmental projects" class="sr-only peer" />
                  <span data-i18n="form.chip.environment" class="inline-block rounded-full border border-ink/20 px-4 py-2 text-sm transition-colors"></span>
                </label>
                <label class="chip cursor-pointer">
                  <input type="checkbox" name="interests" value="Social & charity work" class="sr-only peer" />
                  <span data-i18n="form.chip.social" class="inline-block rounded-full border border-ink/20 px-4 py-2 text-sm transition-colors"></span>
                </label>
                <label class="chip cursor-pointer">
                  <input type="checkbox" name="interests" value="Media & content" class="sr-only peer" />
                  <span data-i18n="form.chip.media" class="inline-block rounded-full border border-ink/20 px-4 py-2 text-sm transition-colors"></span>
                </label>
                <label class="chip cursor-pointer">
                  <input type="checkbox" name="interests" value="Sports & health" class="sr-only peer" />
                  <span data-i18n="form.chip.sports" class="inline-block rounded-full border border-ink/20 px-4 py-2 text-sm transition-colors"></span>
                </label>
              </div>
            </fieldset>

            <div>
              <label for="bio" data-i18n="form.label.bio" class="block font-medium mb-1.5"></label>
              <textarea id="bio" name="bio" rows="4" maxlength="300" required
                data-i18n-placeholder="form.placeholder.bio"
                class="w-full rounded-lg border border-ink/15 px-4 py-3 bg-paper focus:outline-none focus:ring-2 focus:ring-amber-300 focus:border-amber-400 transition resize-none"
                aria-describedby="bio-count bio-error"></textarea>
              <div class="flex justify-between mt-1.5">
                <p id="bio-error" class="hidden text-sm text-red-600" aria-live="polite"></p>
                <p id="bio-count" class="text-sm text-ink/40 ml-auto">0 / 300</p>
              </div>
            </div>

            <label class="flex items-start gap-3 cursor-pointer">
              <input type="checkbox" id="consent" name="consent" required
                class="mt-1 w-4 h-4 rounded border-ink/30 text-olive-600 focus:ring-amber-300" />
              <span data-i18n="form.consent" class="text-sm text-ink/70"></span>
            </label>
            <p id="consent-error" class="hidden -mt-4 text-sm text-red-600" aria-live="polite"></p>

            <div>
              <button type="submit" id="submit-btn"
                class="w-full inline-flex justify-center items-center rounded-lg bg-amber-500 px-6 py-3.5 font-display font-semibold text-ink hover:bg-amber-600 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-300 disabled:opacity-60">
                <span id="submit-label" data-i18n="form.submit"></span>
              </button>
              <p data-i18n="form.privacy" class="mt-4 text-sm text-center text-ink/50 leading-relaxed"></p>
              <p id="form-error" class="hidden mt-3 text-sm text-center text-red-600" aria-live="polite"></p>
            </div>
          </form>
        </div>

        <div id="success-wrap" class="hidden text-center py-10">
          <img src="/logo-icon.png" alt="" class="mx-auto w-18 h-18" />
          <h2 data-i18n="success.title" class="font-display font-bold text-2xl mt-6"></h2>
          <p data-i18n="success.desc" class="mt-3 text-ink/70"></p>
        </div>
      </div>
    </section>

    <section id="faq" class="px-5 sm:px-8 py-16 sm:py-24">
      <div class="max-w-2xl mx-auto">
        <h2 data-i18n="faq.title" class="font-display font-bold text-3xl text-center mb-12"></h2>
        <div class="space-y-3">

          <div class="accordion-item border border-ink/10 rounded-xl overflow-hidden" data-open="false">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 text-left px-5 py-4 font-display font-semibold" aria-expanded="false">
              <span data-i18n="faq.q1"></span>
              <svg class="accordion-chevron shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="accordion-panel">
              <div data-i18n="faq.a1" class="px-5 pb-4 text-ink/70 leading-relaxed"></div>
            </div>
          </div>

          <div class="accordion-item border border-ink/10 rounded-xl overflow-hidden" data-open="false">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 text-left px-5 py-4 font-display font-semibold" aria-expanded="false">
              <span data-i18n="faq.q2"></span>
              <svg class="accordion-chevron shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="accordion-panel">
              <div data-i18n="faq.a2" class="px-5 pb-4 text-ink/70 leading-relaxed"></div>
            </div>
          </div>

          <div class="accordion-item border border-ink/10 rounded-xl overflow-hidden" data-open="false">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 text-left px-5 py-4 font-display font-semibold" aria-expanded="false">
              <span data-i18n="faq.q3"></span>
              <svg class="accordion-chevron shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="accordion-panel">
              <div data-i18n="faq.a3" class="px-5 pb-4 text-ink/70 leading-relaxed"></div>
            </div>
          </div>

          <div class="accordion-item border border-ink/10 rounded-xl overflow-hidden" data-open="false">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 text-left px-5 py-4 font-display font-semibold" aria-expanded="false">
              <span data-i18n="faq.q4"></span>
              <svg class="accordion-chevron shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="accordion-panel">
              <div data-i18n="faq.a4" class="px-5 pb-4 text-ink/70 leading-relaxed"></div>
            </div>
          </div>

          <div class="accordion-item border border-ink/10 rounded-xl overflow-hidden" data-open="false">
            <button type="button" class="accordion-trigger w-full flex items-center justify-between gap-4 text-left px-5 py-4 font-display font-semibold" aria-expanded="false">
              <span data-i18n="faq.q5"></span>
              <svg class="accordion-chevron shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="accordion-panel">
              <div data-i18n="faq.a5" class="px-5 pb-4 text-ink/70 leading-relaxed"></div>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="px-5 sm:px-8 py-12 bg-ink text-paper/80">
    <div class="max-w-6xl mx-auto">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6">
        <div class="flex items-center gap-2.5">
          <span class="flex items-center justify-center w-7 h-7 rounded-full bg-paper/95 shrink-0">
            <img src="/logo-icon.png" alt="" aria-hidden="true" class="h-5 w-auto" />
          </span>
          <span class="font-display font-semibold text-paper">APEC Volunteers</span>
        </div>
        <div class="flex gap-6 text-sm">
          <a href="mailto:btore25@apec.edu.kz" class="hover:text-paper transition-colors">btore25@apec.edu.kz</a>
          <a href="https://www.instagram.com/_toreevbek.o6/" class="hover:text-paper transition-colors">Instagram</a>
        </div>
      </div>
      <div class="mt-8 pt-6 border-t border-paper/10 flex flex-col sm:flex-row gap-2 sm:justify-between text-sm text-paper/50">
        <p data-i18n="footer.tagline"></p>
        <p data-i18n="footer.copyright"></p>
      </div>
      <p class="mt-3 text-center text-[11px] text-paper/20">developed by Ibrahim D</p>
    </div>
  </footer>

</body>
</html>
